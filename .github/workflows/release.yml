name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import Code Signing Certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          CERT_PATH=$RUNNER_TEMP/certificate.p12

          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

      - name: Build and Package App
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          make package

      - name: Notarize and Staple App & DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/GTV Remote.app" "$RUNNER_TEMP/app-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app-notarize.zip" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "dist/GTV Remote.app"
          rm -f "$RUNNER_TEMP/app-notarize.zip"

          # Recreate ZIP and DMG with the stapled .app, then notarize & staple DMG
          rm -f "dist/GTV Remote.zip" "dist/GTV Remote.dmg"
          ditto -c -k --sequesterRsrc --keepParent "dist/GTV Remote.app" "dist/GTV Remote.zip"
          make dmg
          xcrun notarytool submit "dist/GTV Remote.dmg" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "dist/GTV Remote.dmg"

      - name: Prepare Release Artifacts
        run: |
          TAG="${{ github.ref_name }}"
          cp "dist/GTV Remote.dmg" "dist/GTV-Remote-${TAG}.dmg"
          cp "dist/GTV Remote.zip" "dist/GTV-Remote-${TAG}.zip"

      - name: Clean Up Keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

      - name: Extract Release Notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$RUNNER_TEMP/release_notes.md"
          if python3 - "$VERSION" "$NOTES_FILE" <<'EOF'
          import re, sys
          version, out_path = sys.argv[1], sys.argv[2]
          with open("CHANGELOG.md", encoding="utf-8") as f:
              text = f.read()
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          m = re.search(pattern, text, flags=re.MULTILINE | re.DOTALL)
          if m and m.group(1).strip():
              with open(out_path, "w", encoding="utf-8") as out:
                  out.write(m.group(1).strip() + "\n")
              sys.exit(0)
          sys.exit(1)
          EOF
          then
            PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              printf "\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n" "${{ github.repository }}" "$PREV_TAG" "$GITHUB_REF_NAME" >> "$NOTES_FILE"
            else
              printf "\n**Full Changelog**: https://github.com/%s/commits/%s\n" "${{ github.repository }}" "$GITHUB_REF_NAME" >> "$NOTES_FILE"
            fi
            echo "body_path=$NOTES_FILE" >> "$GITHUB_OUTPUT"
            echo "generate_notes=false" >> "$GITHUB_OUTPUT"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
            echo "generate_notes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "GTV Remote ${{ github.ref_name }}"
          files: |
            dist/GTV-Remote-${{ github.ref_name }}.dmg
            dist/GTV-Remote-${{ github.ref_name }}.zip
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.generate_notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
